name: Deploy TheChase to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Firebase access rules
        run: npx -y firebase-tools@15.34.0 emulators:exec --only database --project demo-thechase 'node --test tests/firebase-rules.mjs'
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
